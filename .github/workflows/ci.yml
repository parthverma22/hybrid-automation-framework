name: Hybrid Automation CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1-5'

jobs:
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Run API tests
        run: mvn test -DsuiteFile=src/test/resources/testng-api.xml
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-api-results
          path: target/allure-results

  ui-tests:
    name: UI Tests (Headless Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Run UI tests
        run: mvn test -DsuiteFile=src/test/resources/testng-ui.xml -Dbrowser=chrome -Dheadless=true
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-artifacts
          path: |
            target/surefire-reports/
            test-output/extent-reports/

  parallel-full-suite:
    name: Parallel Full Suite + Allure Report
    runs-on: ubuntu-latest
    needs: [ api-tests, ui-tests ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Run full suite in parallel
        run: mvn test -DsuiteFile=src/test/resources/testng-parallel.xml -Dbrowser=chrome -Dheadless=true
      - name: Generate Allure report
        if: always()
        run: mvn allure:report
      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-full-report
          path: target/site/allure-maven-plugin
      - name: Upload ExtentReports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-reports
          path: test-output/extent-reports/
